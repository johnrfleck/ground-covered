<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Ground Covered</title>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=Spectral:ital,wght@0,400;1,400&display=swap">
<style>
/* Layout: the map is the page. It takes the left and sizes itself to the window height;
   a narrow rail on the right holds the year, the transport controls and a year-by-year key.
   One deliberate look: night-map dark, so nineteen rainbow hues can all stay vivid. */
:root {
  color-scheme: dark;
  --bg: #0b0d0c; --panel: #141816; --ink: #eef1ea; --ink-2: #b9c0b6; --muted: #858c82; --rule: #252b27; --axis: #3b423d;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --ui: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --text: "Spectral", Georgia, "Times New Roman", serif;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 1rem; line-height: 1.45; }
.outer { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 1rem 2rem; }
.page { margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr) 20rem; grid-template-areas: "map head" "map ctrl" "map rest"; grid-template-rows: auto auto 1fr; gap: 1.25rem 1.75rem; align-items: start; }
#map { grid-area: map; position: relative; min-width: 0; }
#map canvas { display: block; max-width: 100%; border-radius: 6px; background: var(--panel); }
.head { grid-area: head; min-width: 0; }
.ctrl { grid-area: ctrl; min-width: 0; display: flex; flex-direction: column; gap: 0.8rem; }
.rest { grid-area: rest; min-width: 0; display: flex; flex-direction: column; gap: 0.8rem; }
@media (max-width: 820px) {
  .page { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "ctrl" "map" "rest"; grid-template-rows: none; }
}
.quad { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.8rem; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 600; text-transform: uppercase; font-size: clamp(2.2rem, 5vw, 3rem); line-height: 0.92; margin: 0.35rem 0 0.6rem; text-wrap: balance; }
.head p { margin: 0; font-family: var(--text); font-size: 1.02rem; line-height: 1.5; color: var(--ink-2); }
.readout { display: flex; align-items: flex-end; gap: 0.75rem; }
.readout b { font-family: var(--display); font-weight: 600; white-space: nowrap; font-size: 4.6rem; line-height: 0.82; font-variant-numeric: tabular-nums; }
.readout i { width: 14px; height: 3.2rem; border-radius: 3px; display: block; }
.stats { font-size: 0.9rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.stats strong { color: var(--ink); font-weight: 600; }
.scrub { display: flex; align-items: center; gap: 0.75rem; }
.scrub input[type="range"] { flex: 1; min-width: 0; accent-color: var(--ink); }
.btn { font-family: var(--ui); font-weight: 600; font-size: 0.85rem; color: var(--bg); background: var(--ink); border: 0; border-radius: 999px; padding: 0.4rem 1rem; cursor: pointer; min-width: 4.6rem; }
.btn:hover { background: #ffffff; }
.check { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; color: var(--ink-2); cursor: pointer; }
.check input { accent-color: var(--ink); width: 1rem; height: 1rem; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h2 { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.8rem; color: var(--muted); margin: 0; }
.years { display: flex; flex-direction: column; }
.yr { display: grid; grid-template-columns: 3.9rem minmax(0, 1fr) 3.4rem; gap: 0.5rem; align-items: center; background: transparent; border: 0; color: var(--ink); font-family: var(--ui); font-size: 0.82rem; font-variant-numeric: tabular-nums; padding: 2px 4px; margin: 0 -4px; border-radius: 4px; cursor: pointer; text-align: left; }
.yr:hover { background: var(--panel); }
.yr span:last-child { text-align: right; color: var(--ink-2); }
.yr .track { height: 11px; }
.yr .bar { height: 11px; min-width: 3px; border-radius: 0 3px 3px 0; }
.yr.off { opacity: 0.28; }
.yr.on { background: var(--panel); font-weight: 600; }
.yr.on span:last-child { color: var(--ink); }
.cap { font-size: 0.78rem; line-height: 1.45; color: var(--muted); }
.zoom { position: absolute; left: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--axis); background: var(--panel); color: var(--ink); font-family: var(--ui); font-size: 1.15rem; font-weight: 600; line-height: 1; cursor: pointer; padding: 0; }
.zoom button.fit { font-size: 0.68rem; letter-spacing: 0.04em; text-transform: uppercase; }
.zoom button:hover:not(:disabled) { background: var(--rule); }
.zoom button:disabled { opacity: 0.4; cursor: default; }
.wheel { display: flex; flex-direction: column; gap: 0.45rem; }
.wheel .sw { display: flex; gap: 2px; }
.wheel button { flex: 1; min-width: 0; height: 26px; border: 0; border-radius: 3px; padding: 0; cursor: pointer; }
.wheel button[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.wheel .hint { font-size: 0.78rem; color: var(--muted); }
#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 0.8rem; font-weight: 600; padding: 0.35rem 0.6rem; border-radius: 5px; display: flex; align-items: center; gap: 0.45rem; box-shadow: 0 4px 14px rgba(0,0,0,0.5); }
#tip i { width: 10px; height: 10px; border-radius: 2px; display: block; }
</style>

<div class="outer">
<main class="page" id="page">
  <div id="map"><canvas id="cv" role="img" aria-label="Map of Albuquerque showing the ground I have ridden through, colored by the year I first reached it"></canvas><div class="zoom" id="zoom" hidden><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">−</button><button type="button" class="fit" id="zfit" aria-label="Show the whole map">Fit</button></div></div>
  <header class="head">
    <div class="quad">Albuquerque, N. Mex. · by bike</div>
    <h1>Ground covered</h1>
    <p>Every patch of the metro area I have ridden through, colored by the year I first got there. Pick the color the earliest years start on. From there the years run down the rainbow to violet, then start over at red.</p>
  </header>
  <section class="ctrl" aria-label="Year controls">
    <div class="readout"><i id="chip"></i><b id="year"></b></div>
    <div class="stats" id="stats"></div>
    <div class="scrub">
      <button type="button" class="btn" id="play">Play</button>
      <input type="range" id="slider" aria-label="Year">
    </div>
    <label class="check"><input type="checkbox" id="only"> Show only this year’s new ground</label>
    <div class="wheel" id="wheel" hidden>
      <h2 id="wheelLabel"></h2>
      <div class="sw" id="swatches" role="group" aria-labelledby="wheelLabel"></div>
      <div class="hint" id="wheelHint"></div>
    </div>
  </section>
  <section class="rest">
    <h2>New ground each year</h2>
    <div class="years" id="years"></div>
    <div class="cap" id="cap"></div>
  </section>
</main>
</div>
<div id="tip" hidden><i></i><span></span></div>

const ZOOM = false;
const view = {k: 1, x: 0, y: 0};            // zoom factor, and the window's top-left as a fraction of the whole map
const HC = Math.ceil(M.cols / 2), HR = Math.ceil(M.rows / 2);
const half = document.createElement('canvas'); half.width = HC; half.height = HR;   // coarser copy, so thin lines stay visible when zoomed out
let dims = [0, 0], raf = 0;
const kMax = () => Math.max(4, 9 * M.cols / (dims[0] || 500));
function clampView() {
  view.k = Math.max(1, Math.min(kMax(), view.k));
  const s = 1 / view.k; view.x = Math.max(0, Math.min(1 - s, view.x)); view.y = Math.max(0, Math.min(1 - s, view.y));
}
function paint() {
  const oc = off.getContext('2d'), img = oc.createImageData(M.cols, M.rows), px = img.data, si = M.years.indexOf(sel);
  const hc = half.getContext('2d'), himg = hc.createImageData(HC, HR), hp = himg.data;
  for (let k = NYR - 1; k >= 0; k--) {       // newest first, so the earliest year wins where squares merge
    if (only ? k !== si : k > si) continue;
    const c = COL[k].rgb, list = perYear[k];
    for (let j = 0; j < list.length; j++) {
      const ix = list[j], p = ix * 4; px[p] = c[0]; px[p + 1] = c[1]; px[p + 2] = c[2]; px[p + 3] = 255;
      const q = (((ix / M.cols) | 0) >> 1) * HC + ((ix % M.cols) >> 1) << 2; hp[q] = c[0]; hp[q + 1] = c[1]; hp[q + 2] = c[2]; hp[q + 3] = 255;
    }
  }
  oc.putImageData(img, 0, 0); hc.putImageData(himg, 0, 0);
}
function render() {
  const size = layout(), W = size[0], H = size[1], cv = $('#cv'), dpr = window.devicePixelRatio || 1;
  dims = size; clampView();
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.width = W + 'px'; cv.style.height = H + 'px'; }
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W, H);
  const scale = view.k * W * dpr / M.cols;   // device pixels per grid square
  const src = M.cols > 1400 && scale < 0.8 ? half : off;
  c.imageSmoothingEnabled = scale < 1.6; c.imageSmoothingQuality = 'high';
  c.drawImage(src, view.x * src.width, view.y * src.height, src.width / view.k, src.height / view.k, 0, 0, W, H);
  const PX = lng => ((lng - M.lng0) / (M.lng1 - M.lng0) - view.x) * view.k * W, PY = lat => ((M.lat1 - lat) / (M.lat1 - M.lat0) - view.y) * view.k * H, halo = css('--panel');
  function label(txt, lat, lng, rot, color, italic) {
    c.save(); c.translate(PX(lng), PY(lat)); c.rotate(rot * Math.PI / 180);
    c.font = italic ? 'italic 400 ' + (W < 420 ? 13 : 16) + 'px ' + css('--text') : '600 ' + (W < 420 ? 10 : 11) + 'px ' + css('--display');
    c.textAlign = 'center'; c.textBaseline = 'middle';
    try { c.letterSpacing = italic ? '2px' : '1.5px'; } catch (_) {}
    c.lineWidth = 4; c.strokeStyle = halo; c.lineJoin = 'round'; c.strokeText(txt, 0, 0); c.fillStyle = color; c.fillText(txt, 0, 0); c.restore();
  }
  label('Rio Grande', 35.128, -106.696, -76, css('--ink'), true);
  label('WEST MESA', 35.095, -106.762, 0, css('--ink-2'), false);
  label('SANDIA FOOTHILLS', 35.15, -106.482, -90, css('--ink-2'), false);
  label('SOUTH VALLEY', 34.985, -106.725, 0, css('--ink-2'), false);
  /* scale bar: the longest round distance that fits in about 110 px at this zoom */
  const pxPerMi = view.k * W / (M.mi_per_col * M.cols);
  const steps = [[3, '3 mi'], [2, '2 mi'], [1, '1 mi'], [0.5, '½ mi'], [0.25, '¼ mi'], [1000 / 5280, '1,000 ft'], [500 / 5280, '500 ft'], [250 / 5280, '250 ft'], [100 / 5280, '100 ft']];
  const pick = steps.find(t => t[0] * pxPerMi <= 110) || steps[steps.length - 1];
  const bar = pick[0] * pxPerMi, bx = 14, by = H - 16;
  c.strokeStyle = halo; c.lineWidth = 4.5; c.beginPath(); c.moveTo(bx, by - 5); c.lineTo(bx, by); c.lineTo(bx + bar, by); c.lineTo(bx + bar, by - 5); c.stroke();
  c.strokeStyle = css('--ink'); c.lineWidth = 1.5; c.stroke();
  c.font = '500 11px ' + css('--ui'); c.fillStyle = css('--ink'); c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.lineWidth = 3; c.strokeStyle = halo; c.strokeText(pick[1], bx + bar + 6, by + 1); c.fillText(pick[1], bx + bar + 6, by + 1);
  c.textAlign = 'center'; c.font = '600 12px ' + css('--display'); c.strokeText('N', W - 20, 20); c.fillText('N', W - 20, 20);
  c.strokeStyle = css('--ink'); c.lineWidth = 1.5; c.beginPath(); c.moveTo(W - 20, 48); c.lineTo(W - 20, 26); c.moveTo(W - 24, 32); c.lineTo(W - 20, 26); c.lineTo(W - 16, 32); c.stroke();
  if (ZOOM) {
    $('#zout').disabled = $('#zfit').disabled = view.k <= 1.001; $('#zin').disabled = view.k >= kMax() - 0.001;
    cv.style.cursor = view.k > 1.001 ? 'grab' : ''; cv.style.touchAction = view.k > 1.001 ? 'none' : 'pan-y';
  }
}
function schedule() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); }
function draw() {
  paint(); render();
  const si = M.years.indexOf(sel);
  $('#year').textContent = LABEL[si]; $('#chip').style.background = COL[si].hex;
  $('#stats').innerHTML = '<strong>+' + fmt(perYear[si].length) + '</strong> new squares on ' + fmt(M.rides[si]) + ' rides<br><strong>' + fmt(cum[si]) + '</strong> squares in all by the end of ' + sel;
  document.querySelectorAll('.yr').forEach((b, k) => { b.classList.toggle('on', k === si); b.classList.toggle('off', only ? k !== si : k > si); b.setAttribute('aria-pressed', k === si); });
}
function setYear(y) { sel = y; $('#slider').value = y; draw(); }
function stop() { clearInterval(timer); timer = null; $('#play').textContent = 'Play'; }
function play() {
  if (timer) { stop(); return; }
  if (sel >= LAST) setYear(M.years[0]);
  $('#play').textContent = 'Pause';
  timer = setInterval(() => { if (sel >= LAST) { stop(); return; } setYear(M.years[M.years.indexOf(sel) + 1]); }, 850);
}

/* year key: color, year, bar of new squares, count */
const yearsHost = $('#years');
M.years.forEach((y, k) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'yr';
  b.innerHTML = '<span>' + LABEL[k] + '</span><span class="track"><span class="bar" style="display:block;width:' + (perYear[k].length / maxNew * 100).toFixed(1) + '%;background:' + COL[k].hex + '"></span></span><span>' + fmt(perYear[k].length) + '</span>';
  b.setAttribute('aria-label', LABEL[k] + ': ' + fmt(perYear[k].length) + ' new squares');
  b.addEventListener('click', () => { stop(); setYear(y); });
  yearsHost.appendChild(b);
});
function paintKey() { document.querySelectorAll('.yr .bar').forEach((el, k) => { el.style.background = COL[k].hex; }); }
if (PICKER) {
  const HUES = [[8, 'red'], [24, 'red-orange'], [40, 'orange'], [54, 'gold'], [70, 'yellow'], [88, 'yellow-green'], [104, 'lime'], [120, 'green'], [136, 'emerald'], [150, 'spring green'], [166, 'sea green'], [182, 'teal'], [198, 'sky blue'], [214, 'azure'], [230, 'blue'], [246, 'indigo'], [262, 'violet'], [278, 'purple'], [999, 'orchid']];
  const WORDS = M.years.map((y, i) => HUES.find(h => i / (NYR - 1) * 285 < h[0])[1]);
  const sw = $('#swatches');
  $('#wheel').hidden = false;
  $('#wheelLabel').textContent = 'Color for ' + LABEL[0];
  function paintWheel() {
    sw.querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-pressed', i === shift));
    const wrapAt = NYR - shift;
    $('#wheelHint').textContent = shift === 0 ? LABEL[0] + ' is red and ' + LABEL[NYR - 1] + ' is the last violet. Tap a color to start the wheel there.'
      : LABEL[0] + ' starts at ' + WORDS[shift] + '. The wheel reaches the last violet in ' + LABEL[wrapAt - 1] + ' and starts over at red in ' + LABEL[wrapAt] + '.';
  }
  WHEEL.forEach((c, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.style.background = c.hex;
    b.setAttribute('aria-label', 'Start ' + LABEL[0] + ' at ' + WORDS[i]); b.title = WORDS[i];
    b.addEventListener('click', () => {
      shift = i; COL = M.years.map((y, k) => WHEEL[(k + shift) % NYR]);
      try { localStorage.setItem('gc-wheel-start-' + NYR, String(shift)); } catch (_) {}
      paintKey(); paintWheel(); draw();
    });
    sw.appendChild(b);
  });
  paintWheel();
}
$('#cap').textContent = (ZOOM ? 'Scroll or pinch to zoom, drag to move, double-click to zoom in. ' : '') + 'Each square is about ' + Math.round(M.mi_per_col * 1760) + ' yards across; ' + fmt(cum[NYR - 1]) + ' of them are colored in. Rides through ' + M.through + '. GPS tracks are missing for nearly all rides before 2010, so the earliest ground is under-drawn. Place labels are approximate.';

const sl = $('#slider'); sl.min = M.years[0]; sl.max = LAST; sl.step = 1; sl.value = LAST;
sl.addEventListener('input', () => { stop(); const v = +sl.value; setYear(M.years.indexOf(v) >= 0 ? v : M.years.reduce((a, b) => Math.abs(b - v) < Math.abs(a - v) ? b : a)); });
$('#play').addEventListener('click', play);
$('#only').addEventListener('change', e => { only = e.target.checked; draw(); });

const tip = $('#tip'), cv = $('#cv');
const touches = new Map(); let dragged = false, pinch = 0;
const local = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
function zoomAt(f, px, py) {
  const W = dims[0], H = dims[1], mx = view.x + px / W / view.k, my = view.y + py / H / view.k;
  view.k = Math.max(1, Math.min(kMax(), view.k * f));
  view.x = mx - px / W / view.k; view.y = my - py / H / view.k; clampView(); tip.hidden = true; schedule();
}
if (ZOOM) {
  $('#zoom').hidden = false;
  $('#zin').addEventListener('click', () => zoomAt(1.8, dims[0] / 2, dims[1] / 2));
  $('#zout').addEventListener('click', () => zoomAt(1 / 1.8, dims[0] / 2, dims[1] / 2));
  $('#zfit').addEventListener('click', () => { view.k = 1; view.x = 0; view.y = 0; schedule(); });
  cv.addEventListener('wheel', e => { e.preventDefault(); const p = local(e); zoomAt(Math.exp(-Math.max(-60, Math.min(60, e.deltaY)) * (e.ctrlKey ? 0.02 : 0.004)), p[0], p[1]); }, {passive: false});
  cv.addEventListener('dblclick', e => { const p = local(e); zoomAt(2, p[0], p[1]); });
  cv.addEventListener('pointerdown', e => { touches.set(e.pointerId, local(e)); dragged = false; pinch = 0; if (view.k > 1.001 || touches.size > 1) { try { cv.setPointerCapture(e.pointerId); } catch (_) {} } });
  const lift = e => { touches.delete(e.pointerId); pinch = 0; if (view.k > 1.001) cv.style.cursor = 'grab'; };
  cv.addEventListener('pointerup', lift); cv.addEventListener('pointercancel', lift);
}
cv.addEventListener('pointermove', e => {
  if (ZOOM && touches.has(e.pointerId)) {
    const p = local(e), was = touches.get(e.pointerId); touches.set(e.pointerId, p);
    if (touches.size === 2) {
      const pts = Array.from(touches.values()), d = Math.hypot(pts[0][0] - pts[1][0], pts[0][1] - pts[1][1]);
      if (pinch) zoomAt(d / pinch, (pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2);
      pinch = d; dragged = true; return;
    }
    if (view.k > 1.001) {
      view.x -= (p[0] - was[0]) / dims[0] / view.k; view.y -= (p[1] - was[1]) / dims[1] / view.k; clampView();
      dragged = true; cv.style.cursor = 'grabbing'; tip.hidden = true; schedule(); return;
    }
  }
  const r = cv.getBoundingClientRect(), cx = Math.floor((view.x + (e.clientX - r.left) / r.width / view.k) * M.cols), cy = Math.floor((view.y + (e.clientY - r.top) / r.height / view.k) * M.rows);
  const rad = Math.max(1, Math.min(8, Math.round(4 * M.cols / 1000 / view.k)));
  let best = 0, bd = 999;
  for (let dy = -rad; dy <= rad; dy++) for (let dx = -rad; dx <= rad; dx++) {
    const x = cx + dx, y = cy + dy; if (x < 0 || y < 0 || x >= M.cols || y >= M.rows) continue;
    const v = cellYear[y * M.cols + x], d = dx * dx + dy * dy; if (v && d < bd) { bd = d; best = v; }
  }
  if (!best) { tip.hidden = true; return; }
  tip.firstElementChild.style.background = COL[best - 1].hex; tip.lastElementChild.textContent = 'First ridden in ' + LABEL[best - 1];
  tip.hidden = false;
  const t = tip.getBoundingClientRect(); let L = e.clientX + 14, T = e.clientY + 14;
  if (L + t.width > innerWidth - 8) L = e.clientX - t.width - 14;
  if (T + t.height > innerHeight - 8) T = e.clientY - t.height - 14;
  tip.style.left = Math.max(8, L) + 'px'; tip.style.top = Math.max(8, T) + 'px';
});
cv.addEventListener('pointerleave', () => { tip.hidden = true; });
addEventListener('scroll', () => { tip.hidden = true; }, {passive: true});

function safeDraw() { if ($('.outer').clientWidth) draw(); }
safeDraw();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(safeDraw);
let rt = null, lw = 0, lh = 0;
function onSize() { const w = $('.outer').clientWidth, h = innerHeight; if (w === lw && h === lh) return; lw = w; lh = h; clearTimeout(rt); rt = setTimeout(safeDraw, 120); }
new ResizeObserver(onSize).observe($('.outer'));
addEventListener('resize', onSize);
addEventListener('load', safeDraw);
</script>

</body>
